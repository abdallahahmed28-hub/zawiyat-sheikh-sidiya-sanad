<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073b4c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>سَنَد | المعرفة الشرعية من مصدرها</title>

<style>
:root{
  --navy:#073b4c;
  --navy2:#042d39;
  --teal:#0a8f98;
  --teal2:#14b8a6;
  --orange:#ff8a4c;
  --gold:#d3a85e;
  --cream:#fffaf0;
  --paper:#fffdf8;
  --white:#ffffff;
  --text:#113943;
  --muted:#6f7f84;
  --line:#e2e8e7;
  --ok:#16805f;
  --warn:#b56b25;
  --danger:#a94646;
  --shadow:0 12px 32px rgba(6,50,63,.11);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f1eee7;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(100%,560px);
  min-height:100vh;
  margin:auto;
  background:var(--cream);
  position:relative;
  overflow:hidden;
  padding-bottom:105px;
  box-shadow:0 0 50px rgba(0,0,0,.08);
}

/* =========================
   HEADER
========================= */

.hero{
  min-height:440px;
  position:relative;
  overflow:hidden;
  color:#fff;
  padding:22px 19px 34px;
  background:
    radial-gradient(circle at 13% 9%,rgba(255,138,76,.20),transparent 25%),
    radial-gradient(circle at 88% 35%,rgba(20,184,166,.18),transparent 30%),
    linear-gradient(145deg,#07546b,#073b4c 55%,#032834);
}

.hero:before{
  content:"";
  position:absolute;
  width:430px;
  height:430px;
  border:1px solid rgba(211,168,94,.20);
  border-radius:50%;
  top:-290px;
  right:-120px;
}

.topbar{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo-wrap{
  display:flex;
  align-items:center;
  gap:8px;
}

.logo-img{
  width:61px;
  height:75px;
  border-radius:18px;
  object-fit:cover;
  background:#0a3542;
  border:1px solid rgba(246,207,137,.7);
  box-shadow:0 7px 18px rgba(0,0,0,.18);
}

.logo-fallback{
  width:61px;
  height:75px;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  border-radius:18px;
  border:1px solid rgba(246,207,137,.7);
  color:#f0cf91;
  font-size:10px;
  background:#0a3542;
}

.top-actions{
  display:flex;
  gap:7px;
}

.pill{
  border:1px solid rgba(255,255,255,.20);
  background:rgba(4,34,43,.45);
  color:#fff;
  border-radius:999px;
  padding:9px 12px;
}

.brand{
  position:relative;
  z-index:2;
  text-align:center;
  margin-top:24px;
}

.brand h1{
  margin:0;
  font-size:69px;
  line-height:1;
  color:#fffaf0;
  letter-spacing:-4px;
}

.brand .tagline{
  font-size:19px;
  font-weight:800;
  margin:10px 0 15px;
}

.production{
  line-height:1.85;
  font-size:13px;
  color:#e6eeee;
}

.production b{
  color:#fff;
}

.motto{
  margin-top:10px;
  color:#ffad73;
  font-weight:900;
}

/* =========================
   SEARCH
========================= */

.search-shell{
  position:relative;
  z-index:5;
  margin:-28px 17px 0;
}

.search{
  min-height:65px;
  border-radius:24px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 12px;
  box-shadow:var(--shadow);
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  padding:10px 7px;
  text-align:right;
  color:var(--text);
}

.search button{
  border:0;
  background:transparent;
  font-size:22px;
}

/* =========================
   QUICK ACTIONS
========================= */

.quick{
  padding:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.quick-card{
  min-height:126px;
  border:0;
  border-radius:22px;
  padding:16px 10px;
  text-align:center;
  box-shadow:0 8px 22px rgba(6,50,63,.07);
}

.quick-card span{
  display:block;
  font-size:32px;
  margin-bottom:8px;
}

.quick-card b{
  display:block;
  font-size:17px;
  margin-bottom:4px;
}

.quick-card small{
  font-size:12px;
  line-height:1.45;
}

.q1{
  background:linear-gradient(145deg,#0a8f98,#066478);
  color:#fff;
}

.q2{
  background:#fff7e8;
  border:1px solid #ecd7ad;
  color:var(--text);
}

.q3{
  background:linear-gradient(145deg,#ffae77,#ff844c);
  color:#fff;
}

.q4{
  background:linear-gradient(145deg,#13a8a7,#08757e);
  color:#fff;
}

/* =========================
   CONTENT
========================= */

.about,
.box{
  margin:0 18px 18px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
}

.about{
  background:linear-gradient(135deg,#fff7e8,#fff);
  display:flex;
  gap:13px;
}

.about .icon{
  font-size:29px;
}

.about h3,
.box h3{
  margin:0 0 7px;
}

.about p,
.muted{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.8;
}

.section{
  padding:0 18px 22px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.section-title h2{
  margin:0;
  font-size:22px;
}

.section-title button{
  border:0;
  border-radius:999px;
  background:#f4e7ce;
  color:var(--text);
  padding:7px 12px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.cat{
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  min-height:139px;
  padding:16px 12px;
  text-align:center;
}

.cat .icon{
  width:52px;
  height:52px;
  border-radius:16px;
  display:grid;
  place-items:center;
  margin:0 auto 9px;
  background:#eaf7f4;
  font-size:27px;
}

.cat:nth-child(even) .icon{
  background:#fff0dc;
}

.cat h3{
  margin:0 0 5px;
  font-size:16px;
}

.cat p{
  margin:0;
  font-size:12px;
  color:var(--muted);
  line-height:1.45;
}

.verse{
  margin:0 18px 18px;
  border-radius:23px;
  color:#fff;
  padding:20px;
  background:linear-gradient(120deg,#073b4c,#07606b);
}

.verse small{
  color:#ffb276;
}

.verse blockquote{
  font-size:22px;
  font-weight:900;
  line-height:1.8;
  margin:9px 0;
}

.trust-row{
  display:flex;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #eef1f1;
}

.trust-row:last-child{
  border:0;
}

.trust-dot{
  width:30px;
  height:30px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#e7f4ed;
  color:var(--ok);
  font-weight:900;
}

/* =========================
   PAGES
========================= */

.page{
  display:none;
  padding:22px 18px;
  animation:fade .2s ease;
}

.page.active{
  display:block;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.page-head{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:18px;
}

.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#fff;
  box-shadow:0 5px 16px rgba(0,0,0,.08);
  font-size:19px;
}

.page-head h2{
  margin:0;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:17px;
  margin-bottom:12px;
}

.input{
  width:100%;
  min-height:50px;
  border:1px solid #dde5e5;
  background:#fafcfb;
  border-radius:15px;
  padding:13px;
  outline:0;
  text-align:right;
}

textarea.input{
  min-height:122px;
  resize:vertical;
}

.btn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:13px;
  margin-top:9px;
  font-weight:900;
}

.primary{
  background:linear-gradient(135deg,#0a8f98,#056171);
  color:#fff;
}

.secondary{
  background:#fff7e8;
  border:1px solid #e8d4ad;
  color:var(--text);
}

.result{
  display:none;
  margin-top:13px;
  padding:15px;
  border-radius:16px;
  background:#edf8f5;
  border-right:4px solid var(--ok);
  line-height:1.8;
  font-size:14px;
}

.warning{
  background:#fff2e7;
  border-right-color:var(--orange);
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  margin-bottom:7px;
  background:#e7f4ed;
  color:var(--ok);
}

.badge.warn{
  background:#fff0dd;
  color:#a65f1f;
}

.source-card{
  margin-top:10px;
  padding:12px;
  background:#f6faf9;
  border-radius:14px;
  border:1px solid #e3e9e8;
  font-size:12px;
  line-height:1.7;
}

.source-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:8px;
}

.source-cell{
  padding:8px;
  background:#fff;
  border-radius:10px;
  border:1px solid #edf0f0;
}

/* =========================
   BOOKS
========================= */

.book{
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.cover{
  width:57px;
  height:72px;
  flex:none;
  border-radius:10px;
  display:grid;
  place-items:center;
  color:#f0ce92;
  font-size:25px;
  background:linear-gradient(145deg,#073b4c,#0a8f98);
}

.book h4{
  margin:0 0 4px;
}

.book p{
  margin:0;
  color:var(--muted);
  font-size:12px;
}

.book .open{
  margin-right:auto;
  border:0;
  background:#eaf7f4;
  padding:8px 10px;
  border-radius:12px;
  color:var(--text);
}

/* =========================
   MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  z-index:100;
  inset:0;
  background:rgba(2,28,36,.62);
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(100%,560px);
  max-height:88vh;
  overflow:auto;
  background:var(--cream);
  border-radius:27px 27px 0 0;
  padding:19px;
}

.sheet-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#eef2f2;
  font-size:19px;
}

/* =========================
   NAV
========================= */

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  z-index:50;
  width:min(100%,560px);
  height:84px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(15px);
  border-top:1px solid var(--line);
  padding:7px 6px max(7px,env(safe-area-inset-bottom));
}

.nav{
  border:0;
  background:none;
  color:#36565e;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
}

.nav span{
  font-size:22px;
}

.nav.active{
  color:#ea733a;
  font-weight:900;
}

.ask-nav{
  position:relative;
  top:-17px;
}

.ask-nav span{
  width:58px;
  height:58px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#ff9a5e,#ee6d32);
  color:#fff;
  border:4px solid #fff;
  box-shadow:0 8px 20px rgba(238,109,50,.30);
}

.report{
  border:0;
  background:none;
  color:#a35a3e;
  padding:5px 0;
  font-size:12px;
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:700px){
  body{
    padding:28px 0;
  }

  .app{
    border-radius:30px;
  }

  .bottom{
    bottom:18px;
    border-radius:24px;
    box-shadow:0 14px 35px rgba(0,0,0,.12);
  }
}
</style>
</head>

<body>

<main class="app">

<!-- =========================
     HOME
========================= -->

<section id="home">

<header class="hero">

  <div class="topbar">

    <div class="logo-wrap">

      <img
        src="logo.jpeg"
        class="logo-img"
        alt="زاوية الشيخ سيديا الكبير"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div class="logo-fallback">
        زاوية<br>
        الشيخ سيديا<br>
        الكبير
      </div>

    </div>

    <div class="top-actions">
      <button class="pill">🌐 العربية</button>
      <button class="pill">🔔</button>
    </div>

  </div>

  <div class="brand">

    <h1>سَنَد</h1>

    <div class="tagline">
      المعرفة الشرعية من مصدرها
    </div>

    <div class="production">
      من إنتاج
      <b>زاوية الشيخ سيديا الكبير</b>
      <br>
      بإشراف الرئيس
      <b>الشيخ إسحاق ولد موسى ولد الشيخ سيديا</b>
    </div>

    <div class="motto">
      عِلمٌ · تربيةٌ · إصلاح
    </div>

  </div>

</header>

<!-- SEARCH -->

<div class="search-shell">

  <div class="search">

    <button onclick="runMainSearch()">
      ⌕
    </button>

    <input
      id="mainSearch"
      placeholder="ابحث عن آية، حديث، كتاب أو مسألة..."
      onkeydown="if(event.key==='Enter')runMainSearch()"
    >

    <button onclick="showPage('searchPage')">
